aid: dotloop
url: https://raw.githubusercontent.com/api-evangelist/dotloop/refs/heads/main/apis.yml
name: dotloop
kind: company
description: dotloop is a real estate transaction management platform (owned by Zillow
  Group) that lets agents, teams, and brokerages create and manage transactions -
  called "loops" - end to end, including documents, e-signatures, tasks, participants,
  and compliance workflows. The dotloop Public API v2 is a documented, OAuth2-secured
  JSON REST API at https://api-gateway.dotloop.com/public/v2 that exposes accounts,
  profiles, loops and loop details, folders, documents, participants, tasks,
  activities, contacts, loop templates, and webhook subscriptions, plus a Loop-It
  facade for one-call loop creation.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Real Estate
- Transaction Management
- Loops
- Documents
- E-Signature
- Zillow Group
created: '2026-07-04'
modified: '2026-07-04'
specificationVersion: '0.19'
