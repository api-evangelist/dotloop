actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. dotloop's public API is
    request/response REST (Public API v2), with realtime delivery handled by
    outbound HTTPS webhooks that are already modeled as REST subscription and
    event resources. No AsyncAPI document was created because there is no
    server-push streaming transport on dotloop's own API to model.
