arazzo: 1.0.1
info:
  title: Dotloop Slack new loop channel message
  summary: Post Slack channel messages for new dotloop loops
  description: Post Slack channel messages for new dotloop loops. Reads the newest loop from Dotloop and hands it to slack. Recreated from the Zapier template linked in x-integration; Dotloop has no new-loop
    trigger operation, so the loop is polled with listLoops.
  version: 1.0.0
sourceDescriptions:
- name: dotloopLoops
  url: https://raw.githubusercontent.com/api-evangelist/dotloop/refs/heads/main/openapi/dotloop-loops-api-openapi.yml
  type: openapi
- name: slackChat
  url: https://raw.githubusercontent.com/api-evangelist/slack/refs/heads/main/openapi/slack-chat-api-openapi.yml
  type: openapi
workflows:
- workflowId: dotloop-slack-new-loop-channel-message
  summary: Post Slack channel messages for new dotloop loops
  description: Post Slack channel messages for new dotloop loops.
  inputs:
    type: object
    properties:
      profileId:
        type: integer
        description: Dotloop profile ID
      channel:
        type: string
        description: Slack channel ID
      slackToken:
        type: string
        description: Slack token
  steps:
  - stepId: list-loops
    description: Read the newest loop in the Dotloop profile.
    operationId: $sourceDescriptions.dotloopLoops.listLoops
    parameters:
    - name: profile_id
      in: path
      value: $inputs.profileId
    - name: sort
      in: query
      value: created:desc
    - name: batch_size
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      loopId: $response.body#/data/0/id
      loopName: $response.body#/data/0/name
      loopUrl: $response.body#/data/0/loopUrl
  - stepId: post-message
    description: Post the new loop to a Slack channel.
    operationId: $sourceDescriptions.slackChat.postChatPostmessage
    parameters:
    - name: token
      in: header
      value: $inputs.slackToken
    requestBody:
      contentType: application/x-www-form-urlencoded
      payload:
        channel: $inputs.channel
        text: $steps.list-loops.outputs.loopName
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      ts: $response.body#/ts
  outputs:
    ts: $steps.post-message.outputs.ts
x-integration:
  partner: slack
  template: https://zapier.com/apps/dotloop/integrations/slack/55663/post-slack-channel-messages-for-new-dotloop-loops
  edge_evidence: https://zapier.com/apps/dotloop/integrations/slack/55663/post-slack-channel-messages-for-new-dotloop-loops
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: list-loops
    cause: provider-contract
    why: listLoops declares a 200 with no response schema, so the data/0/id, name and loopUrl paths and the sort value are not settled by the spec
