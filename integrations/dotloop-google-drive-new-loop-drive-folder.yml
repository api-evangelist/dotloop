arazzo: 1.0.1
info:
  title: Dotloop Google Drive new loop folder
  summary: Create Google Drive folders from new Dotloop loops
  description: Create Google Drive folders from new Dotloop loops. Reads the newest loop from Dotloop and hands it to google-drive. Recreated from the Zapier template linked in x-integration; Dotloop has
    no new-loop trigger operation, so the loop is polled with listLoops.
  version: 1.0.0
sourceDescriptions:
- name: dotloopLoops
  url: https://raw.githubusercontent.com/api-evangelist/dotloop/refs/heads/main/openapi/dotloop-loops-api-openapi.yml
  type: openapi
- name: googleDriveFiles
  url: https://raw.githubusercontent.com/api-evangelist/google-drive/refs/heads/main/openapi/google-drive-files-api-openapi.yml
  type: openapi
workflows:
- workflowId: dotloop-google-drive-new-loop-drive-folder
  summary: Create Google Drive folders from new Dotloop loops
  description: Create Google Drive folders from new Dotloop loops.
  inputs:
    type: object
    properties:
      profileId:
        type: integer
        description: Dotloop profile ID
      parentFolderId:
        type: string
        description: Drive folder to create loop folders under
  steps:
  - stepId: list-loops
    description: Read the newest loop in the Dotloop profile.
    operationId: $sourceDescriptions.dotloopLoops.listLoops
    parameters:
    - name: profile_id
      in: path
      value: $inputs.profileId
    - name: sort
      in: query
      value: created:desc
    - name: batch_size
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      loopId: $response.body#/data/0/id
      loopName: $response.body#/data/0/name
      loopUrl: $response.body#/data/0/loopUrl
  - stepId: create-folder
    description: Create a Google Drive folder named after the loop.
    operationId: $sourceDescriptions.googleDriveFiles.createFile
    requestBody:
      contentType: application/json
      payload:
        name: $steps.list-loops.outputs.loopName
        mimeType: application/vnd.google-apps.folder
        parents:
        - $inputs.parentFolderId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      folderId: $response.body#/id
  outputs:
    folderId: $steps.create-folder.outputs.folderId
x-integration:
  partner: google-drive
  template: https://zapier.com/apps/dotloop/integrations/google-drive/50654/create-google-drive-folders-from-new-dotloop-loops
  edge_evidence: https://zapier.com/apps/dotloop/integrations/google-drive/50654/create-google-drive-folders-from-new-dotloop-loops
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: list-loops
    cause: provider-contract
    why: listLoops declares a 200 with no response schema, so the data/0/id, name and loopUrl paths and the sort value are not settled by the spec
