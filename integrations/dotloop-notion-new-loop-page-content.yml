arazzo: 1.0.1
info:
  title: Dotloop Notion new loop page content
  summary: Add content to Notion pages whenever new loops appear in Dotloop
  description: Add content to Notion pages whenever new loops appear in Dotloop. Reads the newest loop from Dotloop and hands it to notion. Recreated from the Zapier template linked in x-integration; Dotloop
    has no new-loop trigger operation, so the loop is polled with listLoops.
  version: 1.0.0
sourceDescriptions:
- name: dotloopLoops
  url: https://raw.githubusercontent.com/api-evangelist/dotloop/refs/heads/main/openapi/dotloop-loops-api-openapi.yml
  type: openapi
- name: notionBlocks
  url: https://raw.githubusercontent.com/api-evangelist/notion/refs/heads/main/openapi/notion-blocks-api-openapi.yml
  type: openapi
workflows:
- workflowId: dotloop-notion-new-loop-page-content
  summary: Add content to Notion pages whenever new loops appear in Dotloop
  description: Add content to Notion pages whenever new loops appear in Dotloop.
  inputs:
    type: object
    properties:
      profileId:
        type: integer
        description: Dotloop profile ID
      pageId:
        type: string
        description: Notion page to append loop content to
      notionVersion:
        type: string
        default: '2022-06-28'
  steps:
  - stepId: list-loops
    description: Read the newest loop in the Dotloop profile.
    operationId: $sourceDescriptions.dotloopLoops.listLoops
    parameters:
    - name: profile_id
      in: path
      value: $inputs.profileId
    - name: sort
      in: query
      value: created:desc
    - name: batch_size
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      loopId: $response.body#/data/0/id
      loopName: $response.body#/data/0/name
      loopUrl: $response.body#/data/0/loopUrl
  - stepId: append-content
    description: Append a paragraph describing the loop to the Notion page.
    operationId: $sourceDescriptions.notionBlocks.appendBlockChildren
    parameters:
    - name: block_id
      in: path
      value: $inputs.pageId
    - name: Notion-Version
      in: header
      value: $inputs.notionVersion
    requestBody:
      contentType: application/json
      payload:
        children:
        - object: block
          type: paragraph
          paragraph:
            rich_text:
            - type: text
              text:
                content: $steps.list-loops.outputs.loopName
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      blockId: $response.body#/id
  outputs:
    blockId: $steps.append-content.outputs.blockId
x-integration:
  partner: notion
  template: https://zapier.com/apps/dotloop/integrations/notion/255566639/add-content-to-notion-pages-whenever-new-loops-appear-in-dotloop
  edge_evidence: https://zapier.com/apps/dotloop/integrations/notion/255566639/add-content-to-notion-pages-whenever-new-loops-appear-in-dotloop
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: list-loops
    cause: provider-contract
    why: listLoops declares a 200 with no response schema, so the data/0/id, name and loopUrl paths and the sort value are not settled by the spec
  - step: append-content
    cause: partner-contract
    why: the Notion-Version header name is taken from the NotionVersion parameter ref and not re-checked; response id path assumed
