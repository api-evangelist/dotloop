description: >-
  FinOps view of dotloop spend. dotloop is a per-seat SaaS subscription (a
  Zillow Group company) billed monthly or annually per agent, team, or
  brokerage seat. The Public API v2 is not separately metered - there is no
  published per-call charge - so cost is driven by subscription seats plus any
  extras (for example SMS delivery or premium integrations). Cost control is
  therefore about seat allocation and utilization rather than API metering.
notes: >-
  dotloop does not publish usage-based API billing; the primary cost driver is
  the number of subscription seats. Verify seat pricing and extras on the
  dotloop plans page during reconciliation.
sources:
- https://www.dotloop.com/products/plans-pricing/
