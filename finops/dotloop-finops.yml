meters:
- name: subscription_seats
  description: Number of active per-user subscription seats (agent / team / brokerage), the primary cost driver.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - profile
  - plan
- name: sms_messages
  description: Per-message SMS delivery charges when the SMS add-on is used.
  unit: messages
  aggregation: sum
  dimensions:
  - account
- name: premium_integrations
  description: Add-on fees for premium integrations (for example advanced Zapier access).
  unit: add_ons
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active seats per profile/brokerage against invoices; identify unused seats.
- name: Allocation
  description: Map seats to teams/offices and map API client applications to the profiles they serve.
- name: Optimization
  description: Right-size seat counts, prefer annual billing (~20% savings), and consolidate integrations to avoid duplicate add-on fees.
- name: Accountability
  description: Assign brokerage/team owners for seat budgets and review seat utilization periodically.
